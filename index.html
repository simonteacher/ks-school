<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광주경신여자고등학교 행정 포털</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:   #0d1b3e;
    --navy2:  #162244;
    --navy3:  #1e2f5c;
    --gold:   #c9a84c;
    --gold2:  #e8c96a;
    --gold3:  #f5e0a0;
    --white:  #ffffff;
    --off:    #f4f5f8;
    --text:   #1a1a2e;
    --muted:  #6b7a99;
    --shadow: 0 8px 40px rgba(13,27,62,.18);
  }

  html, body {
    height: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--off);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── 배경 패턴 ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,168,76,.12) 0%, transparent 70%),
      linear-gradient(160deg, #0d1b3e 0%, #162244 40%, #1e2f5c 100%);
    z-index: 0;
  }

  /* ── 반짝이는 별 레이어 ── */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    opacity: 0;
    animation: twinkle var(--d, 4s) ease-in-out infinite var(--delay, 0s);
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; transform: scale(.6); }
    50%      { opacity: var(--op, .5); transform: scale(1); }
  }

  /* ── 래퍼 ── */
  .wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 24px 64px;
  }

  /* ── 헤더 ── */
  .header {
    text-align: center;
    margin-bottom: 56px;
    animation: fadeDown .7s ease both;
  }
  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-24px); }
    to   { opacity:1; transform: translateY(0); }
  }


  /* ── 로고 ── */
  .logo-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 24px;
  }
  .logo-ring {
    position: relative;
    width: 110px; height: 110px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-ring::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #c9a84c, #e8c96a, #fff8dc, #c9a84c, #e8c96a);
    padding: 3px;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo-ring::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.08), rgba(13,27,62,.7));
    backdrop-filter: blur(2px);
  }
  .logo-img {
    position: relative;
    z-index: 1;
    width: 76px;
    height: 76px;
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 2px 12px rgba(201,168,76,.6));
  }

  .school-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(201,168,76,.35);
    border-radius: 40px;
    padding: 8px 22px 8px 14px;
    margin-bottom: 28px;
    backdrop-filter: blur(8px);
  }
  .badge-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 6px var(--gold); }
    50%      { box-shadow: 0 0 16px var(--gold2); }
  }
  .badge-text {
    font-size: 11px;
    font-weight: 700;
    color: var(--gold2);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .school-name {
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 900;
    color: var(--white);
    letter-spacing: -1px;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .school-name span {
    color: var(--gold2);
  }

  .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,.5);
    font-weight: 400;
    letter-spacing: .5px;
  }

  /* ── 황금 구분선 ── */
  .divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 20px auto 0;
    border-radius: 2px;
  }

  /* ── 카드 그리드 ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 960px;
  }

  /* ── 카드 ── */
  .card {
    position: relative;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 36px 32px 32px;
    cursor: pointer;
    backdrop-filter: blur(16px);
    overflow: hidden;
    text-decoration: none;
    display: block;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease, border-color .3s ease;
    animation: fadeUp .6s ease both;
  }
  .card:nth-child(1) { animation-delay: .1s; }
  .card:nth-child(2) { animation-delay: .2s; }
  .card:nth-child(3) { animation-delay: .3s; }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(32px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--card-from, rgba(79,142,247,.08)), var(--card-to, transparent));
    opacity: 0;
    transition: opacity .3s;
    border-radius: inherit;
  }

  .card:hover {
    transform: translateY(-8px) scale(1.015);
    box-shadow: 0 24px 60px rgba(0,0,0,.35), 0 0 0 1px var(--card-accent, rgba(79,142,247,.4));
    border-color: var(--card-accent, rgba(79,142,247,.4));
  }
  .card:hover::before { opacity: 1; }

  /* 카드별 색상 */
  .card-blue  { --card-from: rgba(79,142,247,.12); --card-to: rgba(124,92,252,.06); --card-accent: rgba(79,142,247,.5); }
  .card-green { --card-from: rgba(52,211,153,.10); --card-to: rgba(16,185,129,.04); --card-accent: rgba(52,211,153,.45); }
  .card-amber { --card-from: rgba(251,191,36,.10);  --card-to: rgba(245,158,11,.04);  --card-accent: rgba(251,191,36,.45); }
  .card-pink  { --card-from: rgba(236,72,153,.10); --card-to: rgba(219,39,119,.04); --card-accent: rgba(236,72,153,.45); }
  /*.card-purple { --card-from: rgba(139,92,246,.10); --card-to: rgba(109,40,217,.04); --card-accent: rgba(139,92,246,.45); }*/

  /* 카드 상단 아이콘 영역 */
  .card-icon-wrap {
    width: 60px; height: 60px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
  }
  .card-blue  .card-icon-wrap { background: rgba(79,142,247,.18); box-shadow: 0 0 0 1px rgba(79,142,247,.3); }
  .card-green .card-icon-wrap { background: rgba(52,211,153,.16); box-shadow: 0 0 0 1px rgba(52,211,153,.3); }
  .card-amber .card-icon-wrap { background: rgba(251,191,36,.14);  box-shadow: 0 0 0 1px rgba(251,191,36,.3); }
  .card-pink  .card-icon-wrap { background: rgba(236,72,153,.16); box-shadow: 0 0 0 1px rgba(236,72,153,.3); }
  /*.card-purple .card-icon-wrap { background: rgba(139,92,246,.16); box-shadow: 0 0 0 1px rgba(139,92,246,.3); }*/
  
  .card-version {
    position: absolute;
    top: 20px; right: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 20px;
    z-index: 1;
  }
  .card-blue  .card-version { background: rgba(79,142,247,.2);  color: #7db8ff; }
  .card-green .card-version { background: rgba(52,211,153,.18); color: #6ee7b7; }
  .card-amber .card-version { background: rgba(251,191,36,.18); color: #fcd34d; }
  .card-pink  .card-version { background: rgba(236,72,153,.2);  color: #f9a8d4; }
  /*.card-purple .card-version { background: rgba(139,92,246,.2); color: #c4b5fd; }*/
  .card-title {
    font-size: 19px;
    font-weight: 800;
    color: var(--white);
    margin-bottom: 8px;
    line-height: 1.3;
    position: relative; z-index: 1;
  }

  .card-desc {
    font-size: 13px;
    color: rgba(255,255,255,.5);
    line-height: 1.7;
    margin-bottom: 24px;
    position: relative; z-index: 1;
  }

  /* 카드 하단 버튼 */
  .card-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    padding: 10px 20px;
    border-radius: 10px;
    transition: gap .25s;
    position: relative; z-index: 1;
  }
  .card-blue  .card-btn { background: rgba(79,142,247,.22);  color: #93c5fd; }
  .card-green .card-btn { background: rgba(52,211,153,.18); color: #6ee7b7; }
  .card-amber .card-btn { background: rgba(251,191,36,.16);  color: #fde68a; }
  .card-pink  .card-btn { background: rgba(236,72,153,.18); color: #f9a8d4; }
  /*.card-purple .card-btn { background: rgba(139,92,246,.22); color: #c4b5fd; }*/
  .card:hover .card-btn { gap: 14px; }

  .card-btn svg {
    width: 14px; height: 14px;
    transition: transform .25s;
  }
  .card:hover .card-btn svg { transform: translateX(3px); }

  /* ── 장식용 빛 글로우 ── */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .18;
    pointer-events: none;
  }

  /* ── 푸터 ── */
  .footer {
    margin-top: 56px;
    text-align: center;
    color: rgba(255,255,255,.25);
    font-size: 11px;
    line-height: 1.8;
    animation: fadeUp .6s ease .4s both;
  }
  .footer strong { color: rgba(255,255,255,.4); font-weight: 600; }

  /* ── 반응형 ── */
  @media (max-width: 640px) {
    .wrapper { padding: 40px 16px 48px; }
    .header  { margin-bottom: 36px; }
    .grid    { grid-template-columns: 1fr; }
    .card    { padding: 28px 24px 24px; }
  }
  /* ── 퀵링크 배너 ── */
.quicklinks {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.quicklinks-title {
  font-size: 14px;
  font-weight: 800;
  color: rgba(201,168,76,.6);
  letter-spacing: 3px;
  text-transform: uppercase;
  padding-left: 5px;
  margin-bottom: 3px;
}
.ql-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(201,168,76,.2);
  border-radius: 10px;
  padding: 8px 14px;
  text-decoration: none;
  backdrop-filter: blur(12px);
  transition: background .25s, border-color .25s, transform .25s;
  min-width: 190px;
}
.ql-item:hover {
  background: rgba(201,168,76,.12);
  border-color: rgba(201,168,76,.5);
  transform: translateX(4px);
}
.ql-icon {
  font-size: 16px;
  width: 28px;
  height: 28px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(201,168,76,.15);
  flex-shrink: 0;
}
.ql-text {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,.75);
  line-height: 1.2;
}
.ql-text span {
  display: block;
  font-size: 10px;
  font-weight: 400;
  color: rgba(201,168,76,.6);
  margin-top: 1px;
}

@media (max-width: 900px) {
  .quicklinks { display: none; }
}
.clock-widget {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 100;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(201,168,76,.3);
  border-radius: 16px;
  padding: 14px 22px;
  backdrop-filter: blur(12px);
  text-align: center;
  min-width: 160px;
}
.clock-day {
  font-size: 11px;
  font-weight: 700;
  color: rgba(201,168,76,.8);
  letter-spacing: 3px;
  margin-bottom: 4px;
}
.clock-date {
  font-size: 12px;
  color: rgba(255,255,255,.5);
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.clock-time {
  font-size: 28px;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 3px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 20px rgba(201,168,76,.4);
}
@media (max-width: 900px) {
  .clock-widget { display: none; }
}
</style>
</head>

<script>
  // 별 생성
  const container = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 1;
    s.style.cssText = `
      width: ${size}px; height: ${size}px;
      left: ${Math.random()*100}%;
      top:  ${Math.random()*100}%;
      --d: ${(Math.random()*4+3).toFixed(1)}s;
      --delay: ${(Math.random()*5).toFixed(1)}s;
      --op: ${(Math.random()*.4+.2).toFixed(2)};
    `;
    container.appendChild(s);
  }
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function updateClock() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const h = String(now.getHours()).padStart(2,'0');
  const mi = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockDay').textContent = days[now.getDay()];
  document.getElementById('clockDate').textContent = `${y}. ${m}. ${d}`;
  document.getElementById('clockTime').textContent = `${h}:${mi}:${s}`;
}
updateClock();
setInterval(updateClock, 1000);
</script>
