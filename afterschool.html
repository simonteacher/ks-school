<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방과후학교 강좌목록 출력 시스템</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --ink:#1a1a2e; --ink-light:#4a4a6a; --ink-faint:#8888aa;
      --rule:#c8c8d8; --rule-heavy:#666688;
      --accent:#2d4a8a; --bg-head:#1a1a2e; --bg-paper:#fafbff;
      --slot-a-bg:#edf3ff; --slot-a-h:#1e3a7a;
      --slot-b-bg:#fff2ec; --slot-b-h:#7a3a1e;
      --slot-c-bg:#edfff4; --slot-c-h:#1e7a3a;
      --slot-d-bg:#fffaed; --slot-d-h:#7a6a1e;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:#eef0f5;min-height:100vh}

    /* ── 업로드 화면 ── */
    #uploadScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
    .upload-card{background:#fff;border-radius:20px;padding:52px 44px;max-width:540px;width:100%;box-shadow:0 8px 48px rgba(26,26,46,0.12);text-align:center}
    .u-school{font-family:'Nanum Myeongjo',serif;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:3px;margin-bottom:8px}
    .u-title{font-family:'Nanum Myeongjo',serif;font-size:24px;font-weight:800;color:var(--ink);margin-bottom:6px;line-height:1.35}
    .u-sub{font-size:13px;color:var(--ink-faint);margin-bottom:36px}
    .drop-zone{border:2.5px dashed var(--rule-heavy);border-radius:14px;padding:44px 20px;cursor:pointer;transition:all .2s;position:relative;background:var(--bg-paper)}
    .drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:var(--slot-a-bg)}
    .drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    .drop-icon{font-size:42px;margin-bottom:12px}
    .drop-text{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}
    .drop-hint{font-size:12px;color:var(--ink-faint)}
    .u-chips{margin-top:22px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    .u-chip{font-size:12px;color:var(--ink-light);display:flex;align-items:center;gap:5px}

    /* ── 툴바 ── */
    #printScreen{display:none}
    .toolbar{background:var(--bg-head);padding:13px 28px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 16px rgba(0,0,0,.3)}
    .tb-title{font-family:'Nanum Myeongjo',serif;font-size:14px;font-weight:700;color:rgba(255,255,255,.9);flex:1}
    .tb-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 18px;border-radius:7px;font-size:13px;font-family:'Pretendard',sans-serif;font-weight:600;cursor:pointer;border:none;transition:all .18s}
    .tb-ghost{background:rgba(255,255,255,.1);color:#fff}.tb-ghost:hover{background:rgba(255,255,255,.2)}
    .tb-white{background:#fff;color:var(--ink)}.tb-white:hover{background:#e8f0ff;color:var(--accent)}

    /* ── 문서 페이지 ── */
    .page-wrap{padding:36px 28px 60px;display:flex;flex-direction:column;align-items:center;gap:36px}
    .page{background:#fff;width:210mm;box-shadow:0 4px 32px rgba(26,26,46,.15);border-radius:3px;overflow:hidden}

    /* 헤더 */
    .doc-hd{background:var(--bg-head);color:#fff;padding:26px 30px 22px;position:relative;overflow:hidden}
    .doc-hd::before{content:'';position:absolute;right:-20px;top:-20px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.04)}
    .hd-school{font-size:10px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.45);margin-bottom:5px;font-family:'Nanum Myeongjo',serif}
    .hd-title{font-family:'Nanum Myeongjo',serif;font-size:20px;font-weight:800;letter-spacing:.5px;margin-bottom:3px}
    .hd-period{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:12px}
    .hd-chips{display:flex;gap:10px;flex-wrap:wrap}
    .hd-chip{font-size:10.5px;color:rgba(255,255,255,.75);background:rgba(255,255,255,.09);padding:3px 10px;border-radius:20px}

    /* 본문 */
    .doc-body{padding:20px 24px 24px}
    .slot-group{margin-bottom:20px}
    .slot-group:last-child{margin-bottom:0}

    /* 슬롯 헤더 */
    .slot-hd{display:flex;align-items:center;padding:7px 13px;border-radius:6px 6px 0 0}
    .slot-hd-label{font-family:'Nanum Myeongjo',serif;font-size:12.5px;font-weight:700;color:#fff}
    .slot-hd-cnt{font-size:10px;font-weight:600;color:rgba(255,255,255,.75);margin-left:auto}

    /* 테이블 */
    .ct{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
    .ct thead th{padding:6px 9px;font-weight:700;font-size:9.5px;letter-spacing:.4px;text-align:left;border-bottom:2px solid currentColor;color:#fff}
    .ct tbody td{padding:6.5px 9px;border-bottom:1px solid rgba(0,0,0,.055);vertical-align:middle;color:var(--ink);line-height:1.45}
    .ct tbody tr:last-child td{border-bottom:none}

    /* 슬롯별 */
    .slot-a .slot-hd,.slot-a thead tr{background:var(--slot-a-h)}
    .slot-a tbody tr:nth-child(odd) td{background:var(--slot-a-bg)}
    .slot-b .slot-hd,.slot-b thead tr{background:var(--slot-b-h)}
    .slot-b tbody tr:nth-child(odd) td{background:var(--slot-b-bg)}
    .slot-c .slot-hd,.slot-c thead tr{background:var(--slot-c-h)}
    .slot-c tbody tr:nth-child(odd) td{background:var(--slot-c-bg)}
    .slot-d .slot-hd,.slot-d thead tr{background:var(--slot-d-h)}
    .slot-d tbody tr:nth-child(odd) td{background:var(--slot-d-bg)}
    .slot-etc .slot-hd,.slot-etc thead tr{background:#555}
    .slot-etc tbody tr:nth-child(odd) td{background:#f5f5f5}

    .badge{display:inline-block;padding:1.5px 7px;border-radius:10px;font-size:9px;font-weight:700}
    .b-full{background:#fde8e8;color:#c0392b}
    .b-near{background:#fff3e0;color:#d35400}
    .b-ok{background:#e8f4e8;color:#27ae60}

    /* 푸터 */
    .doc-ft{padding:12px 24px;border-top:1.5px solid var(--rule);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .ft-lbl{font-size:9.5px;font-weight:700;color:var(--ink-faint);letter-spacing:1px}
    .ft-items{display:flex;gap:10px;flex-wrap:wrap}
    .ft-item{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--ink-light)}
    .ft-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}

    @media print{
      body{background:#fff}
      .toolbar{display:none!important}
      #uploadScreen{display:none!important}
      #printScreen{display:block!important}
      .page-wrap{padding:0;gap:0}
      .page{width:100%;box-shadow:none;border-radius:0}
      .slot-group{page-break-inside:avoid}
    }
    @media(max-width:800px){
      .page{width:100%;min-height:auto}
      .page-wrap{padding:12px}
    }
  </style>
</head>
<body>

<div id="uploadScreen">
  <div class="upload-card">
    <div class="u-school">광주경신여자고등학교</div>
    <div class="u-title">방과후학교 강좌목록<br>출력 시스템</div>
    <div class="u-sub">리로스쿨 엑셀 파일 → 인쇄용 문서로 자동 변환</div>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFile(this.files[0])">
      <div class="drop-icon">📊</div>
      <div class="drop-text">엑셀 파일을 클릭하거나 드래그하세요</div>
      <div class="drop-hint">.xlsx / .xls 파일 지원</div>
    </div>
    <div class="u-chips">
      <div class="u-chip">📋 A·B·C·D반 자동 분류</div>
      <div class="u-chip">📊 신청/정원 현황 표시</div>
      <div class="u-chip">🖨️ 바로 인쇄 가능</div>
    </div>
  </div>
</div>

<div id="printScreen">
  <div class="toolbar">
    <div class="tb-title" id="tbTitle">강좌목록</div>
    <button class="tb-btn tb-ghost" onclick="goBack()">← 다시 업로드</button>
    <button class="tb-btn tb-white" onclick="window.print()">🖨️ 인쇄하기</button>
  </div>
  <div class="page-wrap" id="pageWrap"></div>
</div>

<script>
  // 드래그앤드롭
  const dz = document.getElementById('dropZone');
  dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('drag')});
  dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
  dz.addEventListener('drop', e=>{
    e.preventDefault();dz.classList.remove('drag');
    const f=e.dataTransfer.files[0]; if(f) handleFile(f);
  });

  function handleFile(file) {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        processData(rows, file.name);
      } catch(err) { alert('파일 오류: '+err.message); }
    };
    reader.readAsArrayBuffer(file);
  }

  // 컬럼 매핑
  function mapRow(row) {
    const keys = Object.keys(row);
    const f = (...cs) => {
      for(const c of cs){
        const k=keys.find(k=>k.replace(/\s/g,'').includes(c.replace(/\s/g,'')));
        if(k!==undefined) return String(row[k]||'');
      }
      return '';
    };
    return {
      no:      f('순번','번호'),
      grade:   f('학년'),
      name:    f('강좌명','강좌','과목명'),
      teacher: f('지도교사','교사','담당교사'),
      apply:   f('신청인원','신청'),
      cap:     f('정원'),
      room:    f('장소','강의실'),
      time:    f('시간','요일','시간대'),
    };
  }

  // 슬롯 분류: '월8, 목9' 형식
  const SLOTS = [
    {key:'A', label:'A반', time:'월 8교시 / 목 9교시', cls:'slot-a',
     match: t=>{const s=t.replace(/\s/g,''); return s.includes('월8')&&s.includes('목9');}},
    {key:'B', label:'B반', time:'월 9교시 / 목 8교시', cls:'slot-b',
     match: t=>{const s=t.replace(/\s/g,''); return s.includes('월9')&&s.includes('목8');}},
    {key:'C', label:'C반', time:'화 8교시 / 금 9교시', cls:'slot-c',
     match: t=>{const s=t.replace(/\s/g,''); return s.includes('화8')&&s.includes('금9');}},
    {key:'D', label:'D반', time:'화 9교시 / 금 8교시', cls:'slot-d',
     match: t=>{const s=t.replace(/\s/g,''); return s.includes('화9')&&s.includes('금8');}},
  ];

  function classifySlot(time) {
    for(const s of SLOTS) if(s.match(time)) return s.key;
    return 'ETC';
  }

  function processData(rows, filename) {
    const courses = rows.map(mapRow).filter(r=>r.name && r.name!=='강좌명');

    const grades  = [...new Set(courses.map(r=>r.grade).filter(Boolean))].sort();
    const gradeLabel = grades.length ? grades.map(g=>g+'학년').join('·') : '전체';

    const slotMap = {A:[],B:[],C:[],D:[],ETC:[]};
    courses.forEach(c => {
      const k = classifySlot(c.time);
      slotMap[k].push(c);
    });

    const yearMatch = filename.match(/(\d{4})/);
    const semMatch  = filename.match(/([12])학기/);
    const year = yearMatch ? yearMatch[1] : new Date().getFullYear();
    const sem  = semMatch  ? semMatch[1]  : '';

    renderDocument(slotMap, gradeLabel, year, sem, courses.length, filename);
  }

  function renderDocument(slotMap, gradeLabel, year, sem, total, filename) {
    document.getElementById('uploadScreen').style.display = 'none';
    document.getElementById('printScreen').style.display = 'block';

    const docTitle = `${year}학년도 ${sem?sem+'학기 ':''}${gradeLabel} 방과후학교 강좌목록`;
    document.getElementById('tbTitle').textContent = docTitle;

    const wrap = document.getElementById('pageWrap');
    wrap.innerHTML = '';

    const activeSlots = SLOTS.filter(s=>slotMap[s.key]?.length>0);
    const etcList = slotMap['ETC']||[];

    const summaryChips = activeSlots.map(s=>
      `<div class="hd-chip">📌 ${s.label} ${slotMap[s.key].length}강좌</div>`
    ).join('');

    const page = document.createElement('div');
    page.className = 'page';
    page.innerHTML = `
      <div class="doc-hd">
        <div class="hd-school">광주경신여자고등학교 · GWANGJU KYEONGSIN GIRLS HIGH SCHOOL</div>
        <div class="hd-title">${docTitle}</div>
        <div class="hd-period">리로스쿨 신청 결과 기준</div>
        <div class="hd-chips">
          <div class="hd-chip">📊 총 ${total}강좌</div>
          ${summaryChips}
        </div>
      </div>
      <div class="doc-body" id="docBody"></div>
      <div class="doc-ft">
        <div class="ft-lbl">범 례</div>
        <div class="ft-items">
          <div class="ft-item"><div class="ft-dot" style="background:#e8f4e8"></div>여유 있음</div>
          <div class="ft-item"><div class="ft-dot" style="background:#fff3e0"></div>마감 임박 (85%↑)</div>
          <div class="ft-item"><div class="ft-dot" style="background:#fde8e8"></div>정원 초과</div>
        </div>
      </div>
    `;
    wrap.appendChild(page);

    const body = page.querySelector('#docBody');
    activeSlots.forEach(s => body.appendChild(buildSection(s, slotMap[s.key])));
    if(etcList.length>0) {
      body.appendChild(buildSection({key:'ETC',label:'기타',time:'시간 미분류',cls:'slot-etc'}, etcList));
    }
  }

  function buildSection(slotDef, courses) {
    const g = document.createElement('div');
    g.className = `slot-group ${slotDef.cls}`;

    const tbody = courses.map((c,i)=>{
      const apply = parseInt(c.apply)||0;
      const cap   = parseInt(c.cap)||0;
      let badge = '';
      if(cap>0) {
        const r=apply/cap;
        if(r>=1)    badge=`<span class="badge b-full">${apply}/${cap} 초과</span>`;
        else if(r>=0.85) badge=`<span class="badge b-near">${apply}/${cap} 임박</span>`;
        else         badge=`<span class="badge b-ok">${apply}/${cap}</span>`;
      } else if(apply) badge=`<span class="badge b-ok">${apply}명</span>`;

      return `<tr>
        <td style="text-align:center;color:#bbb;font-size:9.5px">${c.no||i+1}</td>
        <td style="font-weight:500">${esc(c.name)}</td>
        <td>${esc(c.teacher)}</td>
        <td style="text-align:center;font-weight:700">${esc(c.room)}</td>
        <td style="text-align:center">${badge}</td>
      </tr>`;
    }).join('');

    g.innerHTML = `
      <div class="slot-hd">
        <div class="slot-hd-label">${slotDef.label} &nbsp;·&nbsp; ${slotDef.time}</div>
        <div class="slot-hd-cnt">${courses.length}강좌</div>
      </div>
      <table class="ct">
        <colgroup>
          <col style="width:28px"><col style="width:auto">
          <col style="width:68px"><col style="width:38px"><col style="width:72px">
        </colgroup>
        <thead><tr>
          <th style="text-align:center">#</th>
          <th>강 좌 명</th>
          <th>지도교사</th>
          <th style="text-align:center">장소</th>
          <th style="text-align:center">신청/정원</th>
        </tr></thead>
        <tbody>${tbody}</tbody>
      </table>`;
    return g;
  }

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function goBack() {
    document.getElementById('printScreen').style.display='none';
    document.getElementById('uploadScreen').style.display='flex';
    document.getElementById('fileInput').value='';
    document.getElementById('pageWrap').innerHTML='';
  }
</script>
</body>
</html>
